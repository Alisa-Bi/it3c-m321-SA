server:
  port: 8082

spring:
  application:
    name: chat-service
  # Nur lesender Zugriff fuer das Nachholen (docs/spec-live-zustellung.md, Abschnitt 9).
  # Host und Port stehen fest, Zugangsdaten kommen aus denselben Variablen wie beim batch-writer.
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chatapp}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      # Der Dienst startet auch ohne erreichbare Datenbank: Der Pool baut beim Start keine
      # Verbindung auf und laesst den Start nie daran scheitern (-1).
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 5
      # Maximale Wartezeit auf eine Verbindung in Millisekunden, kuerzer als das Zeitlimit
      # der Abfrage (chat.sse.replay-db-timeout).
      connection-timeout: 3000
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:chatapp}
    password: ${RABBITMQ_DEFAULT_PASS:change-me}
    # Der Broker prueft die Verbindung alle 30 Sekunden (Spezifikation, Abschnitt 7).
    # Eine eingefrorene Instanz verliert so nach etwa 60 Sekunden ihre Verbindung, und
    # ihre exklusive Queue wird entfernt.
    requested-heartbeat: 30s
    listener:
      simple:
        # Unbestaetigte Nachrichten pro Consumer (Spezifikation, Abschnitt 3.3). Gilt fuer
        # den einzigen Listener dieses Dienstes, den Zustell-Listener.
        prefetch: ${CHAT_DELIVERY_PREFETCH:10}

chat:
  # Maximale Groesse des Nachrichteninhalts in UTF-8-Bytes (siehe
  # docs/spec-live-zustellung.md, Abschnitt 7). Per Umgebungsvariable ueberschreibbar.
  max-content-bytes: ${CHAT_MAX_CONTENT_BYTES:4096}
  delivery:
    # Obergrenze der bereitliegenden Nachrichten in der Zustell-Queue je Instanz.
    queue-max-length: ${CHAT_DELIVERY_QUEUE_MAX_LENGTH:990}
  ringbuffer:
    # Ringbuffer der letzten Nachrichten (Spezifikation, Abschnitt 5.4 und 7).
    per-room: ${CHAT_RINGBUFFER_PER_ROOM:5000}
    total: ${CHAT_RINGBUFFER_TOTAL:10000}
  sse:
    # Lebensdauer einer SSE-Verbindung in Millisekunden (Spezifikation, Abschnitt 7).
    timeout: ${CHAT_SSE_TIMEOUT:1800000}
    # Abstand zwischen zwei Heartbeats (Spezifikation, Abschnitt 7).
    heartbeat-interval: ${CHAT_SSE_HEARTBEAT_INTERVAL:15s}
    # Maximale Dauer der Datenbankabfrage beim Nachholen (Spezifikation, Abschnitt 7).
    replay-db-timeout: ${CHAT_SSE_REPLAY_DB_TIMEOUT:5s}
    # Zwischenspeicher je Verbindung fuer Live-Nachrichten waehrend des Nachholens (Spezifikation, Abschnitt 7).
    replay-buffer-max: ${CHAT_SSE_REPLAY_BUFFER_MAX:1000}

management:
  health:
    db:
      # Der Dienst arbeitet auch ohne Datenbank. Ein Datenbankausfall soll /actuator/health
      # deshalb nicht auf DOWN setzen.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ch.m321.chatapp: INFO
