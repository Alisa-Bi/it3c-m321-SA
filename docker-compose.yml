services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: change-me
    networks:
      - chat-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - chat-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - chat-net

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.3
    depends_on:
      - keycloak
    volumes:
      - ./keycloak/init:/init
    entrypoint: ["/bin/bash", "/init/init-keycloak.sh"]
    networks:
      - chat-net

  chat-service:
    build:
      context: ./chat-app/backend/chat-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_USERNAME: chatapp
      DB_PASSWORD: change-me
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - chat-net

networks:
  chat-net:
    name: chat-net