# Docker-Compose-Setup fuer diese Abgabe (batch-writer).
#
# Liegt im Repository-Root (PLANUNG.md Abschnitt 5).
#
# Enthaelt nur, was Teil dieser Abgabe ist: postgres, rabbitmq,
# chat-service, batch-writer. keycloak, api-gateway und user-service sind
# nicht Teil dieser Abgabe und deshalb nicht Teil dieses Stacks (Code
# bleibt im Repository bestehen, siehe docs/spec-batch-writer.md,
# Abschnitt 7) - sie sollen die fuer diese Abgabe geprueften Szenarien
# nicht gefaehrden koennen.
#
# Kein Dienst veroeffentlicht einen Port (web-gateway, das den einzigen
# Port haette, ist ebenfalls nicht Teil dieser Abgabe).

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chat-net
    # Kein "ports:" Eintrag.

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chatapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    networks:
      - chat-net
    # Kein "ports:" Eintrag, auch die Management-UI bleibt intern.

  chat-service:
    build:
      context: .
      dockerfile: backend/chat-service/Dockerfile
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chatapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
      CHAT_MAX_CONTENT_BYTES: ${CHAT_MAX_CONTENT_BYTES:-4096}
      CHAT_SSE_TIMEOUT: ${CHAT_SSE_TIMEOUT:-1800000}
      CHAT_SSE_HEARTBEAT_INTERVAL: ${CHAT_SSE_HEARTBEAT_INTERVAL:-15s}
      CHAT_DELIVERY_PREFETCH: ${CHAT_DELIVERY_PREFETCH:-10}
      CHAT_DELIVERY_QUEUE_MAX_LENGTH: ${CHAT_DELIVERY_QUEUE_MAX_LENGTH:-990}
      CHAT_SSE_REPLAY_DB_TIMEOUT: ${CHAT_SSE_REPLAY_DB_TIMEOUT:-5s}
      CHAT_RINGBUFFER_PER_ROOM: ${CHAT_RINGBUFFER_PER_ROOM:-5000}
      CHAT_RINGBUFFER_TOTAL: ${CHAT_RINGBUFFER_TOTAL:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-chatapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    # Bewusst kein depends_on auf postgres: Der Dienst muss auch ohne Datenbank starten und
    # Nachrichten live zustellen (docs/spec-live-zustellung.md, Abschnitt 4.4).
    depends_on:
      - rabbitmq
    networks:
      - chat-net
    # Kein "ports:" Eintrag - Zugriff fuer die Szenarien ueber
    # "docker compose exec" bzw. innerhalb des Netzwerks chat-net.

  batch-writer:
    build:
      context: .
      dockerfile: backend/batch-writer/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chatapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-change-me}
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - chat-net
    # Kein "ports:" Eintrag - batch-writer hat keine REST-Schnittstelle.

networks:
  chat-net:
    driver: bridge

volumes:
  postgres-data: