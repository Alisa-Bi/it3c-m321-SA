server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Anfragen an Benutzerprofile und -suche gehen an den user-service.
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        # Chatraeume, Nachrichten und der WebSocket-Kanal gehen an den chat-service.
        - id: chat-service-api
          uri: http://chat-service:8082
          predicates:
            - Path=/api/chats/**,/api/messages/**
        - id: chat-service-ws
          uri: ws://chat-service:8082
          predicates:
            - Path=/ws/**
  security:
    oauth2:
      resourceserver:
        jwt:
          # Interne Docker-Adresse: das Gateway spricht Keycloak innerhalb
          # des chat-network an, nicht ueber eine oeffentliche URL.
          issuer-uri: http://keycloak:8080/realms/chatapp

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ch.m321.chatapp: INFO
