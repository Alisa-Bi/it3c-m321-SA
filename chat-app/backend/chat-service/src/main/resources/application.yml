server:
  port: 8082

spring:
  application:
    name: chat-service
  datasource:
    url: jdbc:postgresql://postgres:5432/chat_db
    username: ${DB_USERNAME:chatapp}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      # Fuer das Unterrichts-Grundgerüst ausreichend; vor produktivem Einsatz
      # durch Flyway/Liquibase ersetzen (siehe ARCHITECTURE.md, Punkt 6).
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USERNAME:chatapp}
    password: ${RABBITMQ_PASSWORD:change-me}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/chatapp

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    ch.m321.chatapp: INFO
